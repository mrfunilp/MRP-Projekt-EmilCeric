version: '3.8'
services:
  postgres:
    image: postgres:13
    environment:
      POSTGRES_DB: mediadb
      POSTGRES_USER: mediauser
      POSTGRES_PASSWORD: mediapass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
volumes:
  postgres_data: